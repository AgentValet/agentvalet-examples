[project]
name = "agentvalet-example-crewai"
version = "0.1.0"
description = "A crew where every member holds its own attenuated identity."
# CrewAI itself caps at <3.14 — every release does. Declaring a bare >=3.10
# lets a 3.14 user install and then fail on an unresolvable `crewai>=1.0`,
# which reads as our bug rather than an upstream constraint.
requires-python = ">=3.10,<3.14"
dependencies = [
  "crewai-agentvalet>=0.1.0",
  "agentvalet>=0.2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
py-modules = ["demo"]
