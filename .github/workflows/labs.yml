# Proves lab 01 still works for a learner who opens a Codespace today.
#
# Two tiers:
#   - always: secret scan of labs/**, the devcontainer builds, the lab's
#     dependencies install from the public registry.
#   - when the lab CI identity exists (LAB_AGENT_ID etc. secrets): the smoke
#     test runs steps 3, 5 and 7 against the live broker and the lab upstream.
#     Step 4 (approval) needs a human by construction and is not asserted.
#
# The lab agent is a SECOND CI identity in the eval org, granted exactly the
# three lab tools, so the examples' `github:repo.read`-only agent keeps its
# one-scope property that the deny beat relies on.
name: labs

on:
  push:
    paths: ["labs/**", ".devcontainer/**", ".github/workflows/labs.yml"]
  pull_request:
    paths: ["labs/**", ".devcontainer/**", ".github/workflows/labs.yml"]
  schedule:
    # 04:00 UTC daily, offset from smoke.yml so two identities never share a minute.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: secret scan + install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node labs/validate.mjs
      - name: Install lab 01 from the public registry
        working-directory: labs/01-governed-loop
        run: npm install --no-package-lock
      - name: Lab upstream is up
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://api.agentvalet.ai/lab/mcp \
            -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}')
          echo "lab upstream initialize → HTTP $code"
          test "$code" = "200"

  devcontainer:
    name: devcontainer builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: node -e "console.log('devcontainer ok')"

  smoke:
    name: lab 01 smoke (live)
    runs-on: ubuntu-latest
    needs: validate
    env:
      AGENT_ID: ${{ secrets.LAB_AGENT_ID }}
      OWNER_ID: ${{ secrets.LAB_OWNER_ID }}
      AGENT_PRIVATE_KEY_B64: ${{ secrets.LAB_AGENT_PRIVATE_KEY_B64 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Skip until the lab CI identity exists
        id: gate
        run: |
          if [ -z "$AGENT_ID" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "LAB_* secrets not set; skipping live smoke"; fi
      - name: Install
        if: steps.gate.outputs.skip != 'true'
        working-directory: labs/01-governed-loop
        run: npm install --no-package-lock
      - name: Smoke
        if: steps.gate.outputs.skip != 'true'
        working-directory: labs/01-governed-loop
        run: npm run smoke
